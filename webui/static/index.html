<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DwarfStar Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><strong>DwarfStar</strong><span id="status">connessione…</span></header>
  <main id="chat" aria-live="polite"></main>
  <section class="composer">
    <textarea id="prompt" rows="3" placeholder="Scrivi un messaggio…"></textarea>
    <div class="actions">
      <button id="settingsButton" class="secondary">Impostazioni</button>
      <button id="clearButton" class="secondary">Nuova chat</button>
      <button id="stopButton" class="danger" hidden>Stop</button>
      <button id="sendButton">Invia</button>
    </div>
  </section>
  <dialog id="settings">
    <form method="dialog">
      <h2>Impostazioni</h2>
      <label>Chiave API <input id="apiKey" type="password" autocomplete="off"></label>
      <label>Modello <input id="model" value="deepseek-v4-flash"></label>
      <label>Temperatura <input id="temperature" type="number" min="0" max="2" step="0.1" value="1"></label>
      <label>Token massimi <input id="maxTokens" type="number" min="1" value="4096"></label>
      <label><input id="thinking" type="checkbox" checked> Thinking</label>
      <div class="actions"><button>Annulla</button><button id="saveSettings" value="default">Salva</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
